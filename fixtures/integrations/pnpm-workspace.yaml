# Standalone fixture: kept out of the fontphobia workspace (its own lockfile).
allowBuilds:
  esbuild: true
  core-js: false
  core-js-pure: false
  '@parcel/watcher': false
  '@swc/core': false
minimumReleaseAgeExclude:
  - '@11ty/eleventy@3.1.8'
  - '@rsbuild/core@2.3.1'
  - '@rspack/binding-darwin-arm64@2.3.1'
  - '@rspack/binding-darwin-x64@2.3.1'
  - '@rspack/binding-linux-arm64-gnu@2.3.1'
  - '@rspack/binding-linux-arm64-musl@2.3.1'
  - '@rspack/binding-linux-ppc64-gnu@2.3.1'
  - '@rspack/binding-linux-riscv64-gnu@2.3.1'
  - '@rspack/binding-linux-riscv64-musl@2.3.1'
  - '@rspack/binding-linux-s390x-gnu@2.3.1'
  - '@rspack/binding-linux-x64-gnu@2.3.1'
  - '@rspack/binding-linux-x64-musl@2.3.1'
  - '@rspack/binding-wasm32-wasi@2.3.1'
  - '@rspack/binding-win32-arm64-msvc@2.3.1'
  - '@rspack/binding-win32-ia32-msvc@2.3.1'
  - '@rspack/binding-win32-x64-msvc@2.3.1'
  - '@rspack/binding@2.3.1'
  - '@rspack/cli@2.3.1'
  - '@rspack/core@2.3.1'
