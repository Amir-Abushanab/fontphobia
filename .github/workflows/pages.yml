name: Pages

# Publishes site/ (the explainer at https://amir-abushanab.github.io/fontphobia/) to GitHub Pages.
# The checked-in bakery copies are measured before publication; refuse stale outputs.
on:
  push:
    branches: [main]
    paths: ['site/**', 'examples/bakery/**', 'scripts/*bakery*', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-bakery.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
