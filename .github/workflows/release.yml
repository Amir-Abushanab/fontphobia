name: Release

# Push a tag `v<version>` matching packages/cli/package.json to publish to npm with provenance.
# Publishing uses npm trusted publishing (OIDC): on npmjs.com, add this repository and this
# workflow (release.yml) as a trusted publisher for the `fontphobia` package. No token needed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: The tag matches the package version
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "$GITHUB_REF_NAME"
      - name: The changelog has a section for this version (checked before anything is published)
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Pack (prepack builds dist and copies README and LICENSE)
        run: (cd packages/cli && pnpm pack --pack-destination "$RUNNER_TEMP/pkg")
      - name: Publish
        run: |
          npm install -g npm@11  # trusted publishing needs npm 11.5.1 or later
          v="${GITHUB_REF_NAME#v}"
          # The first version is published by hand (npm only lets a package that exists have a trusted publisher).
          if npm view "fontphobia@$v" version >/dev/null 2>&1; then echo "fontphobia@$v is already on npm"; exit 0; fi
          npm publish "$RUNNER_TEMP"/pkg/fontphobia-*.tgz --provenance --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Also runs when the version was already on npm, unless the release exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "release $GITHUB_REF_NAME already exists"; exit 0; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
